<style>
  .t{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace} .s{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes show{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,10px)}}
  .pulse{animation:pulse 2s ease-in-out infinite} .blink{animation:blink 1s step-end infinite}
  .ln{animation:show .45s ease both} .drift{animation:drift 9s ease-in-out infinite}
</style>
